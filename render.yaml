# Render Blueprint (free web service). Set GEMINI_API_KEY in the dashboard (sync: false).
services:
  - type: web
    name: qpaper-slides
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PAGES_PER_CALL
        value: "3"
      - key: GEMINI_WORKERS
        value: "2"
      - key: JOB_TTL_MIN
        value: "60"
